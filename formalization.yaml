version: "v0.4"

project:
  name: "A Cauchy-Schwarz inequality for real powers: proof, equality cases and weighted forms"
  description: >-
    For a vector v with nonnegative entries and a real number p, write v^p for the vector of p-th
    powers of its entries. Johnston, Plosker, Torrance and Varona (arXiv:2507.10327, Conjecture
    5.1) conjectured that ‖v^p‖ ‖w^p‖ - ⟨v^p, w^p⟩ ≤ ‖v‖^p ‖w‖^p - ⟨v, w⟩^p for every real
    p ≥ 2 and all vectors v, w in ℝⁿ with positive entries, with the Euclidean norm and inner
    product. They proved it for integer p and showed that it fails for 1 < p < 2. This
    formalization proves the conjecture for every real p ≥ 2 and all vectors with nonnegative
    entries. It also determines every case of equality: for p > 2 equality holds exactly when v
    and w are linearly dependent or each has at most one nonzero entry, and for p = 2 there is
    one further family supported on two coordinates. Finally, for positive coordinate weights ω
    used in every norm and inner product, the weighted inequality holds for all nonnegative
    vectors exactly when ω_i ω_j ≥ 1 for all i ≠ j, a condition that does not depend on p. The
    proof shows that a 2 × 2 entrywise-power defect matrix is positive semidefinite, using a
    double integral formula and the Cauchy-Schwarz inequality for integrals. The conjecture and
    its equality cases were also proved, independently and concurrently, by Johnston and
    Sababheh (arXiv:2610.12063).
  authors:
    - "Pragyaan Gaur"
  license: "MIT"
  responsible_maintainers:
    - "Pragyaan Gaur"

