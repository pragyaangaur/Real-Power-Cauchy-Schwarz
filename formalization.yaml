      Proves Conjecture 5.1 and its equality cases (their Theorem 4.2) independently and
      concurrently. Their preprint was submitted on 8 October 2026, the same day as the Zenodo
      record above. Their work does not contain the weighted characterisation or a formal proof.
      It also proves a lower bound for the gap, which is not formalized here. Nathaniel Johnston
      told the author of their preprint on 9 October 2026 and said that their next version will
      cite the author's work as concurrent, and the author's arXiv version cites theirs.
  - title: "Principia Math, problem MathDB 369283: informal proof of the inequality"
    id: "MathDB 369283"
    type: other
    location: "https://principia-math.com"
    relationship: other
    note: >-
      The first informal proof of the main inequality, through positive semidefiniteness of the
      2 × 2 defect matrix, was produced by the automated proof system of the Principia Math
      project. The Lean proof of the inequality follows that strategy. The
      equality cases and the weighted characterisation are not in it.
  - title: "Complete characterization of Hadamard powers preserving Loewner positivity, monotonicity, and convexity"
    authors:
      - "Dominique Guillot"
      - "Apoorva Khare"
      - "Bala Rajaratnam"
    id: "arXiv:1311.1581"
    type: paper
    location: "J. Math. Anal. Appl. 425 (2015), 489-507, doi:10.1016/j.jmaa.2014.12.048"
    relationship: background
    note: >-
      The 2 × 2 superadditivity of entrywise powers used in the proof is a special case of their
      Theorem 5.1. The Lean development proves the needed case directly and does not import it.

