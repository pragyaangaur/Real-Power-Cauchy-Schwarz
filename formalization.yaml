status:
  scope: >-
    Formalized: the inequality for every real p ≥ 2 and all v, w in ℝⁿ with nonnegative entries
    (inequality), the conjecture in its original form with positive entries (conjecture_5_1),
    both equality characterisations (equality_cases_of_two_lt for p > 2 and equality_cases_two
    for p = 2), and the weighted characterisation (weighted_characterisation). Every statement
    holds for every n, including n = 0, where both sides are zero. Not formalized: the integer
    case and the failure for 1 < p < 2 from Johnston, Plosker, Torrance and Varona, the case of
    more than two vectors and the open questions in Sections 6 and 8 of the author's paper, and
    the applications report in docs/applications.pdf.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "Conjecture 5.1 of Johnston, Plosker, Torrance and Varona, for nonnegative entries"
    - "Every case of equality, for p > 2 and for p = 2"
    - "Characterisation of the weights for which the weighted inequality holds"

