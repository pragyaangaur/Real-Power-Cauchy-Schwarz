fidelity:
  divergences: >-
    The conjecture assumes positive entries. The theorem inequality assumes only nonnegative
    entries, which is stronger, and conjecture_5_1 restates the original hypotheses. The source
    states the conjecture for n ≥ 1, and the formal statements hold for every n. Real powers are
    Real.rpow, so x ^ p for x ≥ 0 is the usual real power, with 0 ^ p = 0 for p > 0. Linear
    dependence of v and w is expressed by the vanishing of all 2 × 2 minors v i w j - v j w i,
    which is equivalent. The weighted statement writes the weighted norms and inner product as
    explicit finite sums. No other divergences are known.

review:
  status: "author-verified"
  reviewers: []
  notes: >-
    The author checked the informal proofs and compared every statement in Challenge.lean with
    the paper. The Lean proofs use only propext, Classical.choice and Quot.sound, and
    scripts/check.sh fails on any sorry, native_decide or declared axiom. scripts/numerics.py
    tests every statement on random inputs. No independent human review of the formalization has
    taken place.

